<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlashEats Operations</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">FLASHEATS OPERATIONS</p>
      <h1>Active Orders</h1>
      <p class="subtle">Current internal order view</p>
      
      <label class="toggle-wrapper" for="risk-toggle">
        <input type="checkbox" id="risk-toggle" />
        <div class="toggle-switch"></div>
        <strong>Show At-Risk Orders Only</strong>
      </label>
    </header>

    <div id="message" class="message">Loading orders…</div>
    <div id="orders" class="orders"></div>

    <!-- Modal for Order Details -->
    <div id="order-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
