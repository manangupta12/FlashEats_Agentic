<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlashEats Operations</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">FLASHEATS OPERATIONS</p>
      <h1>Active Orders</h1>
      <p class="subtle">Current internal order view</p>
    </header>

    <section class="queue-section" aria-labelledby="queue-heading">
      <h2 id="queue-heading">Needs attention</h2>
      <div id="queue-message" class="message">Loading at-risk orders…</div>
      <div id="queue" class="orders"></div>
      <div id="order-detail" class="order-detail" hidden></div>
    </section>

    <h2>All orders</h2>
    <div id="message" class="message">Loading orders…</div>
    <div id="orders" class="orders"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
